<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirPods диагностика</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }

    #track {
      font-size: 32px;
      font-weight: bold;
      margin: 30px 0;
    }

    #status {
      font-size: 22px;
      min-height: 70px;
      margin: 20px 0;
    }

    #log {
      text-align: left;
      background: #eee;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-family: monospace;
      white-space: pre-wrap;
    }

    button {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 12px auto;
      padding: 18px;
      font-size: 18px;
    }

    audio {
      width: 100%;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<h1>AirPods диагностика</h1>

<div id="track">TEST</div>

<audio id="audio" controls></audio>

<button id="start">▶ СТАРТ</button>

<div id="status">
  Ждём команду AirPods...
</div>

<div id="log">
  ЛОГ:
</div>


<script>

const audio = document.getElementById('audio');
const track = document.getElementById('track');
const status = document.getElementById('status');
const log = document.getElementById('log');


// ========================================
// ТРЕКИ
// ========================================

const tracks = {
  TEST: 'test.mp3',
  A: 'A.mp3',
  C: 'C.mp3'
};

let currentTrack = 'TEST';


// ========================================
// ЛОГ
// ========================================

function addLog(text) {

  const time =
    new Date().toLocaleTimeString();

  log.textContent +=
    '\n' + time + ' — ' + text;

}


// ========================================
// ЗАГРУЗКА
// ========================================

function loadTrack(name, play = true) {

  currentTrack = name;

  audio.src = tracks[name];

  track.textContent = name;

  if ('mediaSession' in navigator) {

    navigator.mediaSession.metadata =
      new MediaMetadata({
        title: name,
        artist: 'AirPods Test'
      });

  }

  if (play) {

    audio.play().catch(() => {});

  }

}


// ========================================
// NEXTTRACK
// ========================================

function nextTrackCommand() {

  addLog('NEXTTRACK');

  status.textContent =
    '⏭ NEXTTRACK получен';


  if (currentTrack === 'TEST') {

    loadTrack('A');

    status.textContent =
      '⏭ TEST → A';

  }

  else {

    status.textContent =
      '⏭ NEXTTRACK получен';

  }

}


// ========================================
// PREVIOUSTRACK
// ========================================

function previousTrackCommand() {

  addLog('PREVIOUSTRACK');

  status.textContent =
    '⏮ PREVIOUSTRACK получен';

}


// ========================================
// PLAY
// ========================================

function playCommand() {

  addLog('PLAY');

  status.textContent =
    '▶ PLAY получен';

}


// ========================================
// PAUSE
// ========================================

function pauseCommand() {

  addLog('PAUSE');

  status.textContent =
    '⏸ PAUSE получен';

}


// ========================================
// START
// ========================================

document.getElementById('start').onclick = () => {

  loadTrack('TEST');

  status.textContent =
    '🎧 TEST играет';

};


// ========================================
// MEDIA SESSION
// ========================================

if ('mediaSession' in navigator) {

  addLog('Media Session доступен');


  navigator.mediaSession.setActionHandler(
    'nexttrack',
    nextTrackCommand
  );


  navigator.mediaSession.setActionHandler(
    'previoustrack',
    previousTrackCommand
  );


  navigator.mediaSession.setActionHandler(
    'play',
    playCommand
  );


  navigator.mediaSession.setActionHandler(
    'pause',
    pauseCommand
  );


  navigator.mediaSession.setActionHandler(
    'stop',
    () => {

      addLog('STOP');

      status.textContent =
        '⏹ STOP получен';

    }
  );


} else {

  status.textContent =
    '❌ Media Session отсутствует';

}


// ========================================
// START TRACK
// ========================================

loadTrack('TEST', false);

</script>

</body>
</html>
