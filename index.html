<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест AirPods</title>
</head>
<body>

<h2>Тест AirPods 2</h2>

<button id="next">ПОНЯЛ — ДАЛЬШЕ</button>
<button id="translate">НЕ ПОНЯЛ — ПЕРЕВОД</button>

<p id="status">Нажми кнопку «Старт аудио»</p>

<button id="start">▶ Старт аудио</button>

<audio id="audio" controls loop>
  <source src="test.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('audio');
const status = document.getElementById('status');

let lastNext = 0;

document.getElementById('next').onclick = () => {
  status.textContent = '✅ ПОНЯЛ — ДАЛЬШЕ';
};

document.getElementById('translate').onclick = () => {
  status.textContent = '🔵 НЕ ПОНЯЛ — ПЕРЕВОД';
};

document.getElementById('start').onclick = async () => {
  try {
    await audio.play();
    status.textContent = '🎧 Аудио играет. Теперь попробуй AirPod.';
  } catch (e) {
    status.textContent = '❌ Не удалось запустить аудио: ' + e;
  }
};

if ('mediaSession' in navigator) {

  status.textContent = 'Media Session поддерживается';

  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Тест AirPods',
    artist: 'Мой тренажёр'
  });

  navigator.mediaSession.setActionHandler('nexttrack', () => {

    const now = Date.now();

    if (now - lastNext < 700) {
      document.getElementById('translate').click();
      status.textContent = '🔵 ДВОЙНАЯ КОМАНДА → ПЕРЕВОД';
    } else {
      document.getElementById('next').click();
    }

    lastNext = now;
  });

  navigator.mediaSession.setActionHandler('previoustrack', () => {
    status.textContent = '⏮ PREVIOUSTRACK ПОЛУЧЕН';
  });

} else {
  status.textContent = '❌ Media Session НЕ поддерживается';
}
</script>

</body>
</html>
