<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест AirPods</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 25px;
      text-align: center;
    }

    button {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 12px auto;
      padding: 18px;
      font-size: 18px;
    }

    #status {
      margin: 25px 0;
      font-size: 20px;
      font-weight: bold;
    }

    #track {
      font-size: 24px;
      margin: 20px;
    }
  </style>
</head>

<body>

  <h1>Тест AirPods</h1>

  <div id="track">Трек: TEST</div>

  <audio id="audio" controls></audio>

  <button id="start">▶ Старт</button>

  <button id="next">
    ПОНЯЛ — ДАЛЬШЕ
  </button>

  <button id="translate">
    НЕ ПОНЯЛ — ПЕРЕВОД
  </button>

  <div id="status">
    Ожидание...
  </div>


<script>

const audio = document.getElementById('audio');
const trackText = document.getElementById('track');
const status = document.getElementById('status');


// ------------------------------------
// ТРЕКИ
// ------------------------------------

const tracks = [
  {
    name: 'TEST',
    file: 'test.mp3'
  },
  {
    name: 'A',
    file: 'A.mp3'
  },
  {
    name: 'B',
    file: 'B.mp3'
  }
];

let currentTrack = 0;


// ------------------------------------
// ЗАГРУЗИТЬ ТРЕК
// ------------------------------------

function loadTrack(index, autoplay = false) {

  currentTrack = index;

  audio.src = tracks[index].file;

  trackText.textContent =
    'Трек: ' + tracks[index].name;

  status.textContent =
    'Загружен: ' + tracks[index].name;

  navigator.mediaSession.metadata =
    new MediaMetadata({
      title: tracks[index].name,
      artist: 'Тест AirPods',
      album: 'AirPods Test'
    });

  if (autoplay) {
    audio.play().catch(() => {});
  }
}


// ------------------------------------
// СЛЕДУЮЩИЙ ТРЕК
// TEST → A → B
// ------------------------------------

function nextTrack() {

  if (currentTrack < tracks.length - 1) {

    currentTrack++;

    loadTrack(currentTrack, true);

    status.textContent =
      '▶ Следующий: ' +
      tracks[currentTrack].name;

  } else {

    status.textContent =
      '🏁 Это последний трек — B';

    audio.pause();
  }
}


// ------------------------------------
// ПРЕДЫДУЩАЯ КОМАНДА
// ------------------------------------

function previousCommand() {

  status.textContent =
    '🔵 PREVIOUSTRACK → НЕ ПОНЯЛ — ПЕРЕВОД';
}


// ------------------------------------
// КНОПКИ
// ------------------------------------

document.getElementById('start').onclick = () => {

  audio.play();

  status.textContent =
    '🎧 Аудио играет: ' +
    tracks[currentTrack].name;
};


document.getElementById('next').onclick = () => {

  nextTrack();
};


document.getElementById('translate').onclick = () => {

  previousCommand();
};


// ------------------------------------
// АВТОМАТИЧЕСКИ ПОСЛЕ ОКОНЧАНИЯ
// TEST → A → B
// ------------------------------------

audio.addEventListener('ended', () => {

  if (currentTrack < tracks.length - 1) {

    nextTrack();

  } else {

    status.textContent =
      '🏁 Все треки закончились';
  }

});


// ------------------------------------
// MEDIA SESSION
// ------------------------------------

if ('mediaSession' in navigator) {

  status.textContent =
    'Media Session поддерживается';

  navigator.mediaSession.setActionHandler(
    'nexttrack',
    () => {

      status.textContent =
        '🎧 AIRPODS → NEXTTRACK';

      nextTrack();
    }
  );


  navigator.mediaSession.setActionHandler(
    'previoustrack',
    () => {

      previousCommand();
    }
  );

} else {

  status.textContent =
    '❌ Media Session не поддерживается';
}


// ------------------------------------
// НАЧАЛЬНЫЙ ТРЕК
// ------------------------------------

loadTrack(0, false);

</script>

</body>
</html>
