<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Тест AirPods</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }

    #track {
      font-size: 32px;
      font-weight: bold;
      margin: 30px 0;
    }

    #status {
      font-size: 20px;
      min-height: 60px;
      margin: 20px 0;
    }

    #counter {
      font-size: 18px;
      margin: 20px;
    }

    button {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 12px auto;
      padding: 18px;
      font-size: 18px;
    }

    audio {
      width: 100%;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<h1>Тест AirPods A2031</h1>

<div id="track">TEST</div>

<audio id="audio" controls></audio>

<button id="start">
  ▶ СТАРТ
</button>

<div id="status">
  Готово
</div>

<div id="counter">
  Команд AirPods: 0
</div>


<script>

const audio = document.getElementById('audio');
const trackElement = document.getElementById('track');
const statusElement = document.getElementById('status');
const counterElement = document.getElementById('counter');


// ========================================
// ТРЕКИ
// ========================================

const tracks = {
  TEST: 'test.mp3',
  A: 'A.mp3',
  C: 'C.mp3'
};


// ========================================
// ТЕКУЩИЙ ТРЕК
// ========================================

let currentTrack = 'TEST';


// ========================================
// СЧЁТЧИК КОМАНД
// ========================================

let totalCommands = 0;


// ========================================
// ПОСЛЕДОВАТЕЛЬНОСТЬ
// ========================================

let commandCount = 0;

let commandTimer = null;


// ========================================
// ЗАГРУЗИТЬ ТРЕК
// ========================================

function loadTrack(name, autoplay = false) {

  currentTrack = name;

  audio.src = tracks[name];

  trackElement.textContent = name;


  if ('mediaSession' in navigator) {

    navigator.mediaSession.metadata =
      new MediaMetadata({
        title: name,
        artist: 'Тест AirPods',
        album: 'AirPods Test'
      });

  }


  if (autoplay) {

    audio.play().catch(() => {});

  }

}


// ========================================
// 1× ДВОЙНОЕ КАСАНИЕ
// TEST → A
// ========================================

function goToA() {

  if (currentTrack === 'TEST') {

    loadTrack('A', true);

    statusElement.textContent =
      '▶ TEST → A';

  } else {

    statusElement.textContent =
      'ℹ Сейчас играет ' + currentTrack;

  }

}


// ========================================
// 2× ДВОЙНОЕ КАСАНИЕ
// → C
// ========================================

function goToC() {

  loadTrack('C', true);

  statusElement.textContent =
    '🎧 → C';

}


// ========================================
// 3× ДВОЙНОЕ КАСАНИЕ
// → ПАУЗА
// ========================================

function pauseAudio() {

  audio.pause();

  statusElement.textContent =
    '⏸ ПАУЗА';

}


// ========================================
// ОБРАБОТКА AIRPODS
// ========================================

function airPodsNextTrack() {

  totalCommands++;

  counterElement.textContent =
    'Команд AirPods: ' + totalCommands;


  commandCount++;

  statusElement.textContent =
    '🎧 Команда ' + commandCount;


  clearTimeout(commandTimer);


  commandTimer = setTimeout(() => {


    // 1×
    if (commandCount === 1) {

      goToA();

    }


    // 2×
    else if (commandCount === 2) {

      goToC();

    }


    // 3×
    else if (commandCount === 3) {

      pauseAudio();

    }


    else {

      statusElement.textContent =
        'Получено команд: ' +
        commandCount;

    }


    commandCount = 0;

  }, 800);

}


// ========================================
// START
// ========================================

document.getElementById('start').onclick = () => {

  loadTrack('TEST', true);

  statusElement.textContent =
    '▶ Играет TEST';

};


// ========================================
// MEDIA SESSION
// ========================================

if ('mediaSession' in navigator) {

  statusElement.textContent =
    '✅ Media Session работает';


  navigator.mediaSession.setActionHandler(
    'nexttrack',
    () => {

      airPodsNextTrack();

    }
  );


  navigator.mediaSession.setActionHandler(
    'previoustrack',
    () => {

      statusElement.textContent =
        '⏮ PREVIOUSTRACK';

    }
  );


} else {

  statusElement.textContent =
    '❌ Media Session не поддерживается';

}


// ========================================
// НАЧАЛО
// ========================================

loadTrack('TEST', false);

</script>

</body>
</html>
